<svg xmlns="http://www.w3.org/2000/svg" width="960" height="332" viewBox="0 0 960 332" role="img" aria-label="Distribuição de modelos: Opus como advisor consultado em três momentos; sessão principal em Sonnet delega a worker, explorer e researcher">
  <style>
    .t { fill: #1F2328; }
    .m { fill: #59636E; }
    .a { fill: #C2410C; }
    .node { fill: #F6F8FA; stroke: #D1D9E0; }
    .main { fill: #FFF8F2; stroke: #C2410C; stroke-width: 1.5; }
    .adv { fill: none; stroke: #8C959F; stroke-dasharray: 5 4; }
    .line { fill: none; stroke: #8C959F; stroke-width: 1.4; }
    .dash { fill: none; stroke: #8C959F; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .ah { fill: #8C959F; }
    .ic { fill: none; stroke: #59636E; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .tag { fill: #EAEEF2; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }

      .t { fill: #E6EDF3; }
      .m { fill: #9198A1; }
      .a { fill: #F0883E; }
      .node { fill: #161B22; stroke: #3D444D; }
      .main { fill: #1C1410; stroke: #F0883E; }
      .adv { stroke: #6E7681; }
      .line { stroke: #6E7681; }
      .dash { stroke: #6E7681; }
      .ah { fill: #6E7681; }
      .ic { stroke: #9198A1; }
      .tag { fill: #21262D; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>

  <!-- Advisor -->
  <rect class="adv" x="24" y="104" width="216" height="124" rx="10"/>
  <text class="m mono" x="42" y="130" font-size="11" letter-spacing="0.6">ADVISOR</text>
  <text class="t" x="42" y="154" font-size="17" font-weight="600">Opus</text>
  <text class="m" x="42" y="178" font-size="12">antes de um plano</text>
  <text class="m" x="42" y="196" font-size="12">diante de erro recorrente</text>
  <text class="m" x="42" y="214" font-size="12">antes de concluir</text>

  <path class="dash" d="M240 166 H310" marker-end="url(#ah)"/>
  <text class="m" x="275" y="156" font-size="11" text-anchor="middle">consulta</text>

  <!-- Sessão principal -->
  <rect class="main" x="312" y="96" width="256" height="140" rx="12"/>
  <text class="a mono" x="332" y="124" font-size="11" letter-spacing="0.6">SESSÃO PRINCIPAL</text>
  <text class="t" x="332" y="150" font-size="17" font-weight="600">Sonnet</text>
  <rect class="tag" x="398" y="136" width="46" height="20" rx="10"/>
  <text class="m mono" x="421" y="150" font-size="11" text-anchor="middle">high</text>
  <text class="m" x="332" y="178" font-size="12.5">planeja, decide e integra</text>
  <text class="m" x="332" y="198" font-size="12.5">revisa o que os subagentes</text>
  <text class="m" x="332" y="216" font-size="12.5">devolvem antes de seguir</text>

  <path class="line" d="M568 140 C 610 140, 610 64, 652 64" marker-end="url(#ah)"/>
  <path class="line" d="M568 166 H652" marker-end="url(#ah)"/>
  <path class="line" d="M568 192 C 610 192, 610 268, 652 268" marker-end="url(#ah)"/>

  <!-- Subagentes -->
  <rect class="node" x="654" y="28" width="282" height="72" rx="10"/>
  <g class="ic" transform="translate(672 46)"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 5l-3 14"/></g>
  <text class="t mono" x="708" y="58" font-size="14" font-weight="600">worker</text>
  <text class="m" x="770" y="58" font-size="12">Sonnet · medium</text>
  <text class="m" x="708" y="80" font-size="12">implementa uma tarefa especificada</text>

  <rect class="node" x="654" y="130" width="282" height="72" rx="10"/>
  <g class="ic" transform="translate(672 148)"><path d="M4 5h6M4 10h4M4 15h3"/><circle cx="15" cy="13" r="4"/><path d="M18 16l3 3"/></g>
  <text class="t mono" x="708" y="160" font-size="14" font-weight="600">explorer</text>
  <text class="m" x="786" y="160" font-size="12">Haiku · medium</text>
  <text class="m" x="708" y="182" font-size="12">lê o código, somente leitura</text>

  <rect class="node" x="654" y="232" width="282" height="72" rx="10"/>
  <g class="ic" transform="translate(672 250)"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></g>
  <text class="t mono" x="708" y="262" font-size="14" font-weight="600">researcher</text>
  <text class="m" x="802" y="262" font-size="12">Haiku · medium</text>
  <text class="m" x="708" y="284" font-size="12">pesquisa documentação e web</text>

  <text class="m" x="440" y="292" font-size="11.5" text-anchor="middle">subagentes devolvem só a conclusão,</text>
  <text class="m" x="440" y="309" font-size="11.5" text-anchor="middle">preservando o contexto da sessão principal</text>
</svg>
